<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admissions CRM — Enquiry to Enrolment</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎓</text></svg>">
</head>
<body>
  <header>
    <div class="logo">
      <span class="mark">◈</span>
      <span>Admissions<span style="color:var(--brand)">CRM</span><div class="logo-sub" id="orgName">…</div></span>
    </div>
    <nav>
      <button data-tab="dashboard" class="active">Dashboard</button>
      <button data-tab="myday">My Day<span class="pill" id="dueCount" style="display:none">0</span></button>
      <button data-tab="pipeline">Pipeline</button>
      <button data-tab="admissions">Admissions</button>
      <button data-tab="outreach">Outreach</button>
      <button data-tab="events">Events</button>
      <button data-tab="reports">Reports</button>
      <button data-tab="manage" id="manageTabBtn" style="display:none">Manage</button>
      <button data-tab="settings" id="settingsTabBtn" style="display:none">Settings</button>
    </nav>
    <div class="spacer"></div>
    <span class="role-tag" id="roleTag">—</span>
    <select id="userSel" class="user-sel" aria-label="Current user"></select>
  </header>
  <main class="wrap" id="view"></main>
  <div id="toast"></div>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="seed.js"></script>
  <script src="app.js"></script>
  <script src="pipeline.js"></script>
  <script src="manage.js"></script>
  <script src="reports.js"></script>
</body>
</html>
