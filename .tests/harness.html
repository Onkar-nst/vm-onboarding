<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Katta suite v2 — test harness</title></head>
<body>
<h1>Test results</h1>
<pre id="results">RUNNING</pre>
<iframe id="frame" style="width:1280px;height:900px"></iframe>
<script>
const results = [];
function report(name, ok, extra) {
  results.push((ok ? "PASS" : "FAIL") + " — " + name + (extra ? " (" + extra + ")" : ""));
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function loadFrame(url) {
  return new Promise(resolve => {
    const f = document.getElementById("frame");
    f.onload = () => resolve(f.contentWindow);
    f.src = url;
  });
}
function wipe(prefix) {
  Object.keys(localStorage).filter(k => k.startsWith(prefix)).forEach(k => localStorage.removeItem(k));
}

/* ================= Academy (vm-onboarding) ================= */
async function testAcademy() {
  wipe("academy_v2");
  const w = await loadFrame("../vm-onboarding/index.html");
  await sleep(700); // async boot + seed
  const d = w.document;
  try {
    report("ACAD: login shows seeded profiles", d.querySelectorAll(".person-btn").length === 2, d.querySelectorAll(".person-btn").length + " profiles");
    // join as a brand-new trainee (tests person creation through the Store)
    d.querySelector("#nameInput").value = "Harness Trainee";
    d.querySelector("#joinBtn").click();
    await sleep(500);
    report("ACAD: new trainee lands on course home", d.body.textContent.includes("Editor Onboarding"));
    const cards = d.querySelectorAll(".mod-card[data-mod]");
    report("ACAD: 8 seeded modules render", cards.length === 8, cards.length + " cards");
    report("ACAD: module 2 locked", cards[1].dataset.state === "locked");
    cards[0].click();
    await sleep(300);
    d.querySelector('.opt[data-i="0"]').click(); // wrong
    await sleep(150);
    d.querySelector('.opt[data-i="2"]').click(); // correct
    await sleep(300);
    const prog = JSON.parse(localStorage.getItem("academy_v2:progress") || "[]");
    const mine = prog.find(p => p.personId && p.passed.includes("MOD-welcome"));
    report("ACAD: quiz pass persisted via Store", !!mine);
    report("ACAD: wrong attempt logged as gap", mine && mine.wrongAnswers.length === 1);
    // lead tools: switch to seeded lead
    d.querySelector("#switchBtn").click();
    await sleep(300);
    [...d.querySelectorAll(".person-btn")].find(b => b.textContent.includes("Priya")).click();
    await sleep(300);
    d.querySelector("#adminBtn").click();
    await sleep(200);
    d.querySelector("#pinInput").value = "1234";
    d.querySelector("#pinGo").click();
    await sleep(400);
    report("ACAD: lead dashboard opens after PIN", d.body.textContent.includes("Trainee progress"));
    report("ACAD: demo submission visible in dashboard", d.body.textContent.includes("Arjun"));
    // review queue: request changes on the seeded submission
    [...d.querySelectorAll(".lead-tab")].find(b => b.textContent.includes("Review")).click();
    await sleep(300);
    d.querySelector("[data-review]").click();
    await sleep(300);
    d.querySelector("[data-gap='1']").click();
    d.querySelector("#rvFeedback").value = "Hook needs the collage composition — see module 3.";
    d.querySelector("#rvChanges").click();
    await sleep(400);
    const subs = JSON.parse(localStorage.getItem("academy_v2:submissions") || "[]");
    report("ACAD: review saved changes_requested + gap + feedback",
      subs[0] && subs[0].status === "changes_requested" && subs[0].gapItems.includes(1) && subs[0].feedback.includes("collage"));
    // course builder: create a new course through the UI
    [...d.querySelectorAll(".lead-tab")].find(b => b.textContent.includes("builder")).click();
    await sleep(300);
    d.querySelector("#addCourse").click();
    await sleep(200);
    d.querySelector("#crTitle").value = "Client Servicing 101";
    d.querySelector("#crSave").click();
    await sleep(400);
    const courses = JSON.parse(localStorage.getItem("academy_v2:courses") || "[]");
    report("ACAD: builder created a second course", courses.length === 2 && courses.some(c => c.title === "Client Servicing 101"));
    // add a module to it via the module editor
    const addBtn = d.querySelector("#addModule");
    report("ACAD: course editor opened for new course", !!addBtn);
    if (addBtn) {
      addBtn.click();
      await sleep(200);
      d.querySelector("#mdTitle").value = "Meet the clients";
      d.querySelector("#mdSections").value = "## First rule\nAlways reply within 4 working hours.";
      d.querySelector("#qzQ").value = "Max reply time?";
      d.querySelector("#qzO0").value = "4 working hours";
      d.querySelector("#qzO1").value = "Two days";
      d.querySelector("#mdSave").click();
      await sleep(400);
      const mods = JSON.parse(localStorage.getItem("academy_v2:modules") || "[]");
      report("ACAD: module authored via builder", mods.some(m => m.title === "Meet the clients" && m.quiz.options.length === 2));
    }
  } catch (e) { report("ACAD: exception", false, e.message); }
  wipe("academy_v2");
  sessionStorage.clear();
}

/* ================= Gear Wall ================= */
async function testGear() {
  wipe("gearwall_v2");
  const w = await loadFrame("../gear-wall/index.html");
  await sleep(800); // async boot + seed
  const d = w.document;
  try {
    report("GEAR: wall renders 16 seeded items", d.querySelectorAll(".gear-card").length === 16, d.querySelectorAll(".gear-card").length + " cards");
    report("GEAR: QR codes generated", d.querySelectorAll(".gear-card .qr svg").length === 16);
    report("GEAR: org name from settings", d.querySelector("#orgName").textContent.includes("Aperture"));
    // pick crew member Adi
    const sel = d.querySelector("#memberSel");
    sel.value = "MB-003";
    sel.dispatchEvent(new w.Event("change"));
    await sleep(300);
    // scanner: BK-001 (approved, today) includes GW-CAM-001
    w.setTab("scanner");
    await sleep(300);
    await w.handleCode("gearwall:GW-CAM-001");
    await sleep(300);
    report("GEAR: pickup modal opened with condition select", !!d.querySelector("#outCond"));
    d.querySelector("#puGo").click();
    await sleep(500);
    let bookings = JSON.parse(localStorage.getItem("gearwall_v2:bookings") || "[]");
    let bk1 = bookings.find(b => b.id === "BK-001");
    report("GEAR: scan picked up booked gear", bk1 && bk1.pickups["GW-CAM-001"] && !!bk1.pickups["GW-CAM-001"].pickedAt);
    // return flow with condition
    w.setTab("wall");
    await sleep(300);
    const retBtn = d.querySelector("[data-return='GW-CAM-001']");
    report("GEAR: wall shows return button while out", !!retBtn);
    retBtn.click();
    await sleep(200);
    d.querySelector("#retGo").click();
    await sleep(500);
    bookings = JSON.parse(localStorage.getItem("gearwall_v2:bookings") || "[]");
    bk1 = bookings.find(b => b.id === "BK-001");
    report("GEAR: return recorded with condition", bk1.pickups["GW-CAM-001"].returnedAt > 0 && bk1.pickups["GW-CAM-001"].inCond === "ok");
    // pending booking can't be picked up (BK-002 → GW-CAM-002, pending)
    w.setTab("scanner");
    await sleep(200);
    await w.handleCode("GW-CAM-002");
    await sleep(300);
    report("GEAR: pending booking blocked at scanner", d.querySelector("#scanResult").textContent.includes("pending approval"));
    // manager approve flow with PIN
    sel.value = "MB-001";
    sel.dispatchEvent(new w.Event("change"));
    await sleep(300);
    w.setTab("calendar");
    await sleep(300);
    d.querySelector("[data-approve='BK-002']").click();
    await sleep(200);
    d.querySelector("#pinInput").value = "1234";
    d.querySelector("#pinGo").click();
    await sleep(500);
    bookings = JSON.parse(localStorage.getItem("gearwall_v2:bookings") || "[]");
    report("GEAR: manager approved pending booking", bookings.find(b => b.id === "BK-002").status === "approved");
    // conflict detection: new booking overlapping BK-003 (approved, days +3..+5) for GW-CAM-003
    const overlapStart = new Date(Date.now() + 4 * 86400000).toISOString().slice(0, 10);
    w.showBookingModal(overlapStart);
    await sleep(300);
    d.querySelector("#bkEnd").value = overlapStart;
    d.querySelector("#bkEnd").dispatchEvent(new w.Event("change"));
    await sleep(200);
    const cam3cb = d.querySelector("#bkGearPick input[value='GW-CAM-003']");
    report("GEAR: clashing gear disabled in booking modal", cam3cb && cam3cb.disabled);
    const cam3label = cam3cb && cam3cb.closest("label");
    report("GEAR: clash reason shown", cam3label && cam3label.textContent.includes("Brand film"));
    w.closeModal();
    // manage: add gear via manager UI
    w.setTab("manage");
    await sleep(300);
    d.querySelector("#mAdd").click();
    await sleep(200);
    d.querySelector("#ngName") || null; // old id — should not exist
    d.querySelector("#gName").value = "Sony A7 IV";
    d.querySelector("#gSave").click();
    await sleep(500);
    const gear = JSON.parse(localStorage.getItem("gearwall_v2:gear") || "[]");
    report("GEAR: manager added new gear with generated id", gear.some(g => g.name === "Sony A7 IV" && /^GW-CAM-\d+$/.test(g.id)));
  } catch (e) { report("GEAR: exception", false, e.message); }
  wipe("gearwall_v2");
  sessionStorage.clear();
}

/* ================= Katta Knowledge ================= */
async function testKatta() {
  wipe("katta_v2");
  localStorage.removeItem("katta_history_v1");
  const w = await loadFrame("../katta-knowledge/index.html");
  await sleep(700); // async boot + seed
  const d = w.document;
  try {
    report("KATTA: episodes seeded into store", (JSON.parse(localStorage.getItem("katta_v2:episodes") || "[]")).length === 8);
    report("KATTA: chips render", d.querySelectorAll("#chips .chip").length === 8);
    const r1 = w.search("What is GTO?");
    report("KATTA: GTO retrieves S01 @14:32", r1.best && r1.best.ep.id === "katta-01" && r1.best.seg.t === "14:32");
    const r2 = w.search("what makes a good hire");
    report("KATTA: hiring retrieves S02", r2.best && r2.best.ep.id === "katta-02");
    const r4 = w.search("quantum jellyfish recipe");
    report("KATTA: nonsense query returns no match", !r4.best);
    w.ask("What is GTO?");
    await sleep(2200);
    report("KATTA: answer card appears", !!d.querySelector(".answer-card"));
    await sleep(3000);
    const txt = d.querySelector(".answer-text");
    report("KATTA: typewriter produced text", txt && txt.textContent.length > 80, (txt ? txt.textContent.length : 0) + " chars");
    report("KATTA: source cites timestamp", d.body.textContent.includes("14:32"));
    // curator: add an episode through the admin editor
    d.querySelector("#adminBtn").click();
    await sleep(200);
    d.querySelector("#pinInput").value = "1234";
    d.querySelector("#pinGo").click();
    await sleep(300);
    d.querySelector("#cpAdd").click();
    await sleep(200);
    d.querySelector("#epTitle").value = "Test Session: Focus";
    d.querySelector("#epSegs").value = "@ 05:10 | focus, deep, work\nDeep work means long uninterrupted blocks protected on the calendar.";
    d.querySelector("#epSave").click();
    await sleep(500);
    const eps = JSON.parse(localStorage.getItem("katta_v2:episodes") || "[]");
    report("KATTA: curator added episode via UI", eps.length === 9 && eps.some(e => e.title === "Test Session: Focus"));
    const r5 = w.search("how does deep work focus happen");
    report("KATTA: new episode immediately searchable", r5.best && r5.best.ep.title === "Test Session: Focus");
  } catch (e) { report("KATTA: exception", false, e.message); }
  wipe("katta_v2");
  localStorage.removeItem("katta_history_v1");
}

/* ================= Admissions CRM ================= */
async function testCrm() {
  wipe("crm_v2");
  sessionStorage.removeItem("crm_user");
  let w = await loadFrame("../CRM/index.html");
  await sleep(1400); // async boot + seeding a full demo season
  let d = w.document;
  const ls = () => JSON.parse(localStorage.getItem("crm_v2:leads") || "[]");
  const tasks = () => JSON.parse(localStorage.getItem("crm_v2:tasks") || "[]");
  try {
    // ---- boot & seed ----
    report("CRM: demo season seeds 46 leads", ls().length === 46, ls().length + " leads");
    report("CRM: dashboard renders 6 stat cards", d.querySelectorAll(".stat").length === 6, d.querySelectorAll(".stat").length + " stats");
    report("CRM: funnel + leaderboard render", d.body.textContent.includes("Admission funnel") && d.body.textContent.includes("Counsellor leaderboard"));

    // ---- new enquiry with auto-assignment ----
    d.querySelector("#dNew").click(); await sleep(250);
    d.querySelector("#lName").value = "Harness Student";
    d.querySelector("#lPhone").value = "9899000001";
    d.querySelector("#lCity").value = "Pune";
    d.querySelector("#lSave").click(); await sleep(800);
    const created = ls().find(l => l.name === "Harness Student");
    report("CRM: new enquiry created + auto-assigned", !!created && !!created.ownerId && created.stage === "new", created && created.id + " → " + created.ownerId);
    report("CRM: 360 drawer opens after create", !!d.querySelector("#drawer"));
    d.querySelector("#dClose").click(); await sleep(150);

    // ---- duplicate detection ----
    d.querySelector("#dNew").click(); await sleep(200);
    d.querySelector("#lPhone").value = "9899000001";
    d.querySelector("#lPhone").dispatchEvent(new w.Event("blur")); await sleep(150);
    report("CRM: duplicate phone flagged before save", (d.querySelector("#dupWarn").textContent || "").includes("duplicate"));
    d.querySelector(".modal [data-close]").click(); await sleep(150);

    // ---- pipeline board ----
    d.querySelector('[data-tab="pipeline"]').click(); await sleep(400);
    report("CRM: board renders all 9 stage columns", d.querySelectorAll(".col").length === 9, d.querySelectorAll(".col").length + " cols");
    report("CRM: lead cards on board", d.querySelectorAll(".lead-card").length >= 40, d.querySelectorAll(".lead-card").length + " cards");

    // ---- stage move via drawer ----
    d.querySelector('[data-card="LD-036"]').click(); await sleep(300);
    d.querySelector("#aStage").click(); await sleep(200);
    d.querySelector('[data-st="contacted"]').click(); await sleep(600);
    report("CRM: stage move persists via Store", ls().find(l => l.id === "LD-036").stage === "contacted");
    d.querySelector("#dClose").click(); await sleep(150);

    // ---- mark lost captures reason + death stage, closes tasks ----
    d.querySelector('[data-card="LD-031"]').click(); await sleep(300);
    d.querySelector("#aStage").click(); await sleep(200);
    d.querySelector('[data-st="lost"]').click(); await sleep(250);
    report("CRM: marking lost demands a reason", !!d.querySelector("#lostR"));
    d.querySelector("#lostGo").click(); await sleep(600);
    const lostLead = ls().find(l => l.id === "LD-031");
    report("CRM: lost reason + death stage recorded", lostLead.stage === "lost" && !!lostLead.lostReason && lostLead.lastStageOrder === 2, lostLead.lostReason);
    report("CRM: open follow-ups auto-closed on loss", tasks().filter(t => t.leadId === "LD-031" && !t.done).length === 0);
    d.querySelector("#dClose").click(); await sleep(150);

    // ---- enrolment flow ----
    d.querySelector('[data-card="LD-009"]').click(); await sleep(300);
    d.querySelector("#aStage").click(); await sleep(200);
    d.querySelector('[data-st="enrolled"]').click(); await sleep(300);
    report("CRM: enrol modal shows fee position", d.body.textContent.includes("Outstanding"));
    d.querySelector("#enrolGo").click(); await sleep(600);
    const enr = ls().find(l => l.id === "LD-009");
    report("CRM: enrolment confirmed with timestamp", enr.stage === "enrolled" && !!enr.enrolledAt);
    d.querySelector("#dClose").click(); await sleep(150);

    // ---- document verification cycle ----
    d.querySelector('[data-card="LD-013"]').click(); await sleep(300);
    d.querySelector('[data-dtab="documents"]').click(); await sleep(250);
    report("CRM: seeded doc shows received state", d.querySelector(".doc-state").classList.contains("recv"));
    d.querySelector(".doc-state").click(); await sleep(500);
    const kian = ls().find(l => l.id === "LD-013");
    report("CRM: doc verify cycle persists", kian.docs["10th Marksheet"] && kian.docs["10th Marksheet"].verified === true);

    // ---- record payment with receipt ----
    d.querySelector('[data-dtab="payments"]').click(); await sleep(250);
    d.querySelector("#payAdd").click(); await sleep(200);
    d.querySelector("#pGo").click(); await sleep(500);
    const pays = JSON.parse(localStorage.getItem("crm_v2:payments") || "[]");
    const receipts = pays.filter(p => p.receiptNo).map(p => p.receiptNo);
    report("CRM: payment recorded, receipts stay unique", pays.filter(p => p.leadId === "LD-013" && p.status === "paid").length === 2 && new Set(receipts).size === receipts.length, receipts.length + " receipts");

    // ---- follow-up task from drawer ----
    d.querySelector("#aTask").click(); await sleep(200);
    d.querySelector("#tGo").click(); await sleep(400);
    report("CRM: follow-up scheduled from drawer", tasks().some(t => t.leadId === "LD-013" && !t.done && t.title === "Follow-up call"));
    d.querySelector("#dClose").click(); await sleep(150);

    // ---- My Day work queue ----
    d.querySelector('[data-tab="myday"]').click(); await sleep(400);
    report("CRM: My Day lists follow-ups", d.querySelectorAll(".task-row").length >= 5, d.querySelectorAll(".task-row").length + " rows");
    const tickBtn = d.querySelector(".task-row .tick[data-done]");
    const tid = tickBtn.dataset.done;
    tickBtn.click(); await sleep(500);
    report("CRM: ticking a follow-up closes it", tasks().find(t => t.id === tid).done === true);

    // ---- template merge fields ----
    const merged = w.applyTemplate("Hi {{firstname}}, {{course}} costs {{fee}}", w.leadById("LD-001"));
    report("CRM: merge fields resolve with Indian grouping", merged.includes("Aarav") && merged.includes("Computer Science") && merged.includes("1,85,000"), merged);

    // ---- admin PIN gate ----
    report("CRM: manage hidden while locked", d.querySelector("#manageTabBtn").style.display === "none");
    d.querySelector('[data-tab="manage"]').click(); await sleep(250);
    d.querySelector("#pinInput").value = "9999";
    d.querySelector("#pinGo").click(); await sleep(250);
    report("CRM: wrong PIN rejected", !!d.querySelector("#pinInput") && d.querySelector("#manageTabBtn").style.display === "none");
    d.querySelector("#pinInput").value = "1234";
    d.querySelector("#pinGo").click(); await sleep(500);
    report("CRM: correct PIN unlocks Manage", d.body.textContent.includes("Programmes") && d.querySelector("#manageTabBtn").style.display !== "none");

    // ---- CSV import ----
    d.querySelector('[data-mt="import"]').click(); await sleep(250);
    d.querySelector("#impSample").click(); await sleep(150);
    d.querySelector("#impPreview").click(); await sleep(250);
    report("CRM: import preview marks rows new", d.querySelectorAll(".tag.cold").length === 3);
    const beforeImp = ls().length;
    d.querySelector("#impGo").click(); await sleep(900);
    report("CRM: CSV import adds 3 tagged leads", ls().length === beforeImp + 3 && ls().filter(l => (l.tags || []).includes("imported")).length === 3);

    // ---- settings persist ----
    d.querySelector('[data-tab="settings"]').click(); await sleep(400);
    d.querySelector("#sSla").value = "30";
    d.querySelector("#setSave").click(); await sleep(400);
    const st = JSON.parse(localStorage.getItem("crm_v2:settings") || "[]").find(s => s.id === "settings");
    report("CRM: settings persist via Store", st.firstResponseSlaMins === 30);

    // ---- reports ----
    d.querySelector('[data-tab="reports"]').click(); await sleep(400);
    report("CRM: reports render ROI + loss analysis", d.body.textContent.includes("Source performance") && d.body.textContent.includes("Why we lose"));
    report("CRM: stage conversion table renders", d.body.textContent.includes("Stage-to-stage conversion"));

    // ---- event desk capture ----
    d.querySelector('[data-tab="events"]').click(); await sleep(400);
    d.querySelector("[data-ecap]").click(); await sleep(250);
    d.querySelector("#ecName").value = "Fair Walkin";
    d.querySelector("#ecPhone").value = "9899000077";
    d.querySelector("#ecGo").click(); await sleep(700);
    const evLead = ls().find(l => l.name === "Fair Walkin");
    report("CRM: event desk capture creates tagged lead", !!evLead && !!evLead.eventId && (evLead.tags || []).includes("event"));
    const evs = JSON.parse(localStorage.getItem("crm_v2:events") || "[]");
    report("CRM: event attendance incremented", evLead && evs.find(e => e.id === evLead.eventId).attended === 1);
    d.querySelector(".modal [data-close]").click(); await sleep(150);

    // ---- outreach templates ----
    d.querySelector('[data-tab="outreach"]').click(); await sleep(300);
    report("CRM: 6 seeded templates render", d.querySelectorAll("[data-tedit]").length === 6);

    // ---- public enquiry form ----
    w = await loadFrame("../CRM/enquiry.html"); await sleep(700);
    d = w.document;
    report("CRM: public form lists 6 programmes", d.querySelectorAll("#fCourse option").length === 6);
    d.querySelector("#fName").value = "Web Student";
    d.querySelector("#fPhone").value = "9899000088";
    d.querySelector("#submit").click(); await sleep(600);
    const webLead = ls().find(l => l.name === "Web Student");
    report("CRM: web enquiry lands assigned in pipeline", !!d.querySelector(".pub-done") && !!webLead && (webLead.tags || []).includes("web") && !!webLead.ownerId);

    // repeat submission must attach to the existing record, not duplicate
    w = await loadFrame("../CRM/enquiry.html"); await sleep(700);
    d = w.document;
    d.querySelector("#fName").value = "Web Student";
    d.querySelector("#fPhone").value = "9899000088";
    d.querySelector("#submit").click(); await sleep(600);
    const acts = JSON.parse(localStorage.getItem("crm_v2:activities") || "[]");
    report("CRM: repeat web submission dedupes", ls().filter(l => l.name === "Web Student").length === 1 && webLead && acts.some(a => a.leadId === webLead.id && a.note.includes("again")));
  } catch (e) { report("CRM: exception", false, e.message); }
  wipe("crm_v2");
  sessionStorage.removeItem("crm_user");
}

(async () => {
  await testAcademy();
  await testGear();
  await testKatta();
  await testCrm();
  const fails = results.filter(r => r.startsWith("FAIL")).length;
  results.push("");
  results.push(fails === 0 ? "ALL TESTS PASSED (" + results.filter(r => r.startsWith("PASS")).length + " checks)" : fails + " FAILURES");
  document.getElementById("results").textContent = results.join("\n");
  document.title = fails === 0 ? "TESTS-OK" : "TESTS-FAILED";
})();
</script>
</body>
</html>
